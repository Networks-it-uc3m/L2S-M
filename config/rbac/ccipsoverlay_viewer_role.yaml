# This rule is not used by the project controllermanager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to l2sm.l2sm.k8s.local resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: controllermanager
    app.kubernetes.io/managed-by: kustomize
  name: ccipsoverlay-viewer-role
rules:
- apiGroups:
  - l2sm.l2sm.k8s.local
  resources:
  - ccipsoverlays
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - l2sm.l2sm.k8s.local
  resources:
  - ccipsoverlays/status
  verbs:
  - get
